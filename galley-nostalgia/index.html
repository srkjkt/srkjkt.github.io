<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 갤러리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
        }

        .gallery-container {
            max-width: 100vw;
            margin: 0 auto;
        }

        /* 이미지 영역 */
        .image-section {
            position: relative;
            /* background-color: #000; */
            background: radial-gradient(circle at center, rgba(128, 128, 128, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
            overflow: hidden;
            height: 80vh;
            /* 화면 높이의 80% */
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            /* width: 150px; */
            width: 25%;
            height: auto;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .gallery-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            /* Ken Burns 효과 기본값 */
            transform: scale(1.03) translateX(-2%) translateY(-2%);
            transition-property: opacity, transform;
            transition-duration: 0.8s, 18s;
            /* opacity는 0.8초, transform은 18초 */
            transition-timing-function: ease-in-out, linear;
        }

        .gallery-image.active {
            opacity: 1;
        }

        /* Ken Burns 효과: 천천히 이동 및 확대 */
        .gallery-image.kenburns-in {
            transform: scale(1.05) translateX(2%) translateY(2%);
            transition-property: opacity, transform;
            transition-duration: 0.8s, 18s;
            transition-timing-function: ease-in-out, linear;
        }

        .gallery-image.kenburns-out {
            transform: scale(1.02) translateX(-3%) translateY(-3%);
            transition-property: opacity, transform;
            transition-duration: 0.8s, 18s;
            transition-timing-function: ease-in-out, linear;
        }

        /* Canvas 영역 */
        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* 네비게이션 버튼 */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 50px;
            height: 100px;
            cursor: pointer;
            color: white;
            font-size: 24px;
            transition: background 0.3s ease;
            z-index: 90;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .prev-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }

        /* 스크롤 영역 */
        .content-section {
            min-height: 500px;
            padding: 40px 20px;
            background-color: white;
        }

        .content-section h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .content-placeholder {
            height: 300px;
            background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 18px;
        }

        /* 푸터 */
        .footer {
            background-color: #333;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .footer h3 {
            margin-bottom: 15px;
        }

        .footer p {
            line-height: 1.8;
            color: #ccc;
        }

        /* 이미지 로딩 상태 */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 80;
        }

        .image-author {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.2vw;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.1);
            padding: 0.1em 0.5em 0.2em 0.5em;
            border-radius: 0.85em;
            pointer-events: none;
            z-index: 120;
            letter-spacing: 0.1em;
        }

        #author-name-first-char {
            color: rgb(255, 190, 144);
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <!-- 이미지 섹션 -->
        <div class="image-section">
            <!-- 로고 -->
            <img src="./Gallery-nostalgia-caligraphy-gold-shadow.png" alt="갤러리 노스탤지아 로고" class="logo">

            <!-- 로딩 표시 -->
            <div class="loading">로딩 중...</div>

            <!-- 이미지 래퍼 -->
            <div class="image-wrapper">
                <!-- Canvas 영역 -->
                <canvas id="effect-canvas"></canvas>

                <!-- 이미지들 (샘플 이미지 5개) -->
                <img src="./1/100x100 nostalgia 1 Acrylic on Canvas 2020.jpg" alt="Gallery Image 1"
                    class="gallery-image active" data-index="0">
                <img src="./1/100x25 nostalgia 1 Oil on Canvas 2020.jpg" alt="Gallery Image 2" class="gallery-image"
                    data-index="1">
                <img src="./1/135x35 nostalgia 1 Oil on canvas 2019.jpg" alt="Gallery Image 3" class="gallery-image"
                    data-index="2">
                <img src="./1/25.5x17.5 nostalgia 1 Acrylic on Canvas 2022.jpg" alt="Gallery Image 4"
                    class="gallery-image" data-index="3">
                <img src="./1/56x41 nostalgia 1 Acrylic on Canvas 2017.jpg" alt="Gallery Image 5" class="gallery-image"
                    data-index="4">
                <!-- 작가 이름 -->
                <div class="image-author">by <span id="author-name-first-char">K</span>IM <span
                        id="author-name-first-char">T</span>AEHWA</div>
            </div>

            <!-- 네비게이션 버튼 -->
            <!-- 
            <button class="nav-button prev-button">←</button>
            <button class="nav-button next-button">→</button>
            -->
        </div>

        <!-- 콘텐츠 섹션 -->
        <div class="content-section">
            <h2>이미지 갤러리</h2>
            <div class="content-placeholder">
                여기에 추가 기능이 들어갈 예정입니다
            </div>
        </div>

        <!-- 푸터 -->
        <footer class="footer">
            <h3>갤러리 소개</h3>
            <p>
                이미지 갤러리는 아름다운 사진들을 한 곳에서 감상할 수 있는 공간입니다.<br>
                자동 슬라이드쇼와 함께 좌우 버튼으로 원하는 이미지를 직접 탐색할 수 있습니다.<br>
                각 이미지는 부드러운 전환 효과와 함께 표시되어 최적의 시각적 경험을 제공합니다.
            </p>
        </footer>
    </div>

    <script>
        // 전역 변수
        let currentIndex = 0;
        let autoSlideInterval;
        let isTransitioning = false;
        const images = document.querySelectorAll('.gallery-image');
        const totalImages = images.length;
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');

        // Canvas 리사이즈
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.8;
        }

        // 이미지 전환 함수
        function showImage(index) {
            if (isTransitioning) return;
            isTransitioning = true;

            // 모든 이미지에서 효과 클래스 제거
            images.forEach(img => {
                img.classList.remove('active', 'kenburns-in', 'kenburns-out');
            });

            // 이전 이미지에 kenburns-out 적용
            const prevImg = images[currentIndex];
            prevImg.classList.add('kenburns-out');

            // 새 이미지에 active, kenburns-in 적용
            const nextImg = images[index];
            setTimeout(() => {
                nextImg.classList.add('active', 'kenburns-in');
                currentIndex = index;
                // 효과가 끝나면 kenburns-in 제거(다음 전환을 위해)
                setTimeout(() => {
                    nextImg.classList.remove('kenburns-in');
                    isTransitioning = false;
                }, 18000); // transform 애니메이션 시간과 맞춤(18초)
            }, 100);
        }

        // 다음 이미지
        function nextImage() {
            resetAutoSlide();
            const nextIndex = (currentIndex + 1) % totalImages;
            showImage(nextIndex);
        }

        // 이전 이미지
        function prevImage() {
            resetAutoSlide();
            const prevIndex = (currentIndex - 1 + totalImages) % totalImages;
            showImage(prevIndex);
        }

        // 자동 슬라이드 시작
        function startAutoSlide() {
            autoSlideInterval = setInterval(nextImage, 5000); // 5초마다 자동 전환
        }

        // 자동 슬라이드 재시작
        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }

        // 이벤트 리스너
        // document.querySelector('.next-button').addEventListener('click', nextImage);
        // document.querySelector('.prev-button').addEventListener('click', prevImage);

        // // 키보드 이벤트 (화살표 키)
        // document.addEventListener('keydown', (e) => {
        //     if (e.key === 'ArrowRight' || e.key === ' ') {
        //         nextImage();
        //     } else if (e.key === 'ArrowLeft') {
        //         prevImage();
        //     }
        // });

        // 이미지 로딩 이벤트
        images.forEach(img => {
            img.addEventListener('load', () => {
                document.querySelector('.loading').style.display = 'none';
            });
        });

        // 윈도우 리사이즈
        window.addEventListener('resize', resizeCanvas);

        // 초기화
        window.addEventListener('load', () => {
            resizeCanvas();
            images[0].classList.add('kenburns-in'); // 첫 이미지에 효과 적용
            startAutoSlide();
        });

    </script>
</body>

</html>
